name: Build APK

# 手机上传整个工程 zip 也能编译：仓库里放 earthquake-app-android.zip，
# 本流程会先解压再编译；电脑上直接传工程文件同样能用。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p "$HOME/Android/Sdk/cmdline-tools"
          cd "$HOME/Android/Sdk/cmdline-tools"
          curl -sL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip -d tmp
          mv tmp/cmdline-tools latest
          rm -rf tmp tools.zip
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "$HOME/Android/Sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/Android/Sdk/platform-tools" >> $GITHUB_PATH
          yes | "$HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unpack project zip (phone upload)
        run: |
          if [ -f earthquake-app-android.zip ]; then
            echo "Found project zip, unpacking..."
            unzip -o earthquake-app-android.zip -d .
          fi
          ls -la

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
